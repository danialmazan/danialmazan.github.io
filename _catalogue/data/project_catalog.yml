        topics: ["places", "people"]
        format: {en: "Visual story", es: "Historia visual"}
        summary: {en: "Compare where people live in Madrid and London.", es: "Compara dónde vive la población de Madrid y Londres."}
        last_published: "2026-08-23"
        title: {en: "Where density actually lives: Madrid vs London", es: "Dónde vive la densidad — Madrid vs Londres"}
        description:
          en: "A visual comparison of how land and residents are distributed by population density across Madrid and London."
          es: "Análisis en áreas pequeñas de cómo se distribuyen el territorio y la población por densidad en Madrid y Londres."
        url: "https://danielalmazan.com/density-madrid-london/"
        url_es: "https://danielalmazan.com/density-madrid-london/?lang=es"
      - id: density-europe
        topics: ["places", "people"]
        format: {en: "Visual story", es: "Historia visual"}
        summary: {en: "Compare how people are spread across 30 European countries.", es: "Compara cómo se distribuye la población en 30 países europeos."}
        last_published: "2026-09-06"
        title: {en: "Empty country, dense country?", es: "¿País vacío, país denso?"}
        description:
          en: "A one-kilometre grid reveals how population density and concentration differ across 30 European countries."
          es: "Una cuadrícula de un kilómetro revela cómo difieren la densidad y la concentración de población en 30 países europeos."
        url: "https://danielalmazan.com/density-europe/"
        url_es: "https://danielalmazan.com/density-europe/?lang=es"
      - id: madrid-rail-density
        topics: ["mobility", "places"]
        format: {en: "Rail access map", es: "Mapa de acceso al tren"}
        summary: {en: "See how far Madrid’s buildings are from rail.", es: "Mide la distancia al tren de los edificios de Madrid."}
        last_published: "2026-09-20"
        title: {en: "How close does Madrid live to rail?", es: "¿A qué distancia vive Madrid del tren?"}
        description:
          en: "A building-level view of straight-line distance to Metro, Cercanías, Metro Ligero and Tranvía."
          es: "Una estimación edificio a edificio de la distancia en línea recta a Metro, Cercanías, Metro Ligero y Tranvía."
        url: "https://danielalmazan.com/madrid-rail-density/"
        url_es: "https://danielalmazan.com/madrid-rail-density/?lang=es"
      - id: madrid-income-rail-access
        topics: ["mobility", "people"]
        format: {en: "Interactive analysis", es: "Análisis interactivo"}
        summary: {en: "Compare income and rail access across Madrid.", es: "Compara la renta y el acceso al tren en Madrid."}
        last_published: "2026-09-27"
        title: {en: "Income and rail access in Madrid", es: "Renta y acceso al tren en Madrid"}
        description:
          en: "Compare census-section income with building-level access to Madrid's rail lines."
          es: "Compara la renta por sección censal con el acceso al tren calculado edificio a edificio en Madrid."
        url: "https://danielalmazan.com/madrid-income-rail-access/"
        url_es: "https://danielalmazan.com/madrid-income-rail-access/?lang=es"

