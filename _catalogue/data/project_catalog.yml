    url_es: "https://danielalmazan.com/density-transport-analysis/?lang=es"
    description:
      en: "Projects exploring how population density and transport shape places"
      es: "Proyectos que exploran cómo la densidad de población y el transporte dan forma a los lugares"
    projects:
      - id: de-aqui-para-alla
        topics: ["mobility", "places"]
        format: {en: "Mobility map", es: "Mapa de movilidad"}
        summary: {en: "See how Spain moves, hour by hour.", es: "Mira cómo se mueve España, hora a hora."}
        last_published: "2026-11-06"
        title: {en: "De aquí para allá", es: "De aquí para allá"}
        description:
          en: "Watch how Spain moves, hour by hour, in a living map of trips between municipalities built from the Ministry of Transport’s open mobility data."
          es: "Mira cómo se mueve España, hora a hora, en un mapa vivo de los viajes entre municipios hecho con los datos abiertos de movilidad del Ministerio de Transportes."
        url: "https://danielalmazan.com/de-aqui-para-alla/"
        url_en: "https://danielalmazan.com/de-aqui-para-alla/en/"
        url_es: "https://danielalmazan.com/de-aqui-para-alla/"
      - id: apretados
        topics: ["places", "people"]
        format: {en: "Density explorer", es: "Explorador de densidad"}
        summary: {en: "See how tightly packed Spain really is.", es: "Descubre cómo se reparte la densidad en España."}
        last_published: "2026-11-03"
        title: {en: "Apretados", es: "Apretados"}
        description:
          en: "Explore how Spain’s population and land are distributed by census-section density, and compare places using official 2025 data."
          es: "Explora cómo se reparten la población y el territorio de España según la densidad de sus secciones censales y compara lugares con datos oficiales de 2025."
        url: "https://danielalmazan.com/apretados/"
        url_en: "https://danielalmazan.com/apretados/?lang=en"
        url_es: "https://danielalmazan.com/apretados/?lang=es"
      - id: kilometro-cero
        topics: ["mobility", "places"]
        format: {en: "Road atlas", es: "Atlas de carreteras"}
        summary: {en: "Follow Spain’s roads and see where they converge.", es: "Sigue las carreteras de España y descubre dónde confluyen."}
        last_published: "2026-11-04"
        title: {en: "Kilómetro Cero", es: "Kilómetro Cero"}
        description:
          en: "Explore the roads of mainland Spain. See how routes converge on cities, compare road basins, find meeting points and see what changes without motorways."
          es: "Explora las carreteras de la España peninsular. Descubre cómo llegan las rutas a cada ciudad, compara cuencas, encuentra puntos de encuentro y mira qué cambia sin autopistas ni autovías."
        url: "https://danielalmazan.com/kilometro-cero/"
        url_en: "https://danielalmazan.com/kilometro-cero/en/"
        url_es: "https://danielalmazan.com/kilometro-cero/"
