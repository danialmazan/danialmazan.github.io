<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive,noimageindex" />
    <meta name="theme-color" content="#121b25" />
    <title>Seven Owls</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          17px/1.6 system-ui,
          sans-serif;
        background: #121b25;
        color: #f5f0e6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        min-height: 100svh;
        max-width: 560px;
        margin: auto;
        padding: 64px 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 56px;
      }
      .brand svg {
        width: 58px;
        height: 64px;
      }
      .brand span {
        font:
          42px/1 Georgia,
          serif;
        letter-spacing: -2px;
      }
      .brand b {
        color: #e7b66d;
        font-weight: 400;
      }
      .eyebrow {
        color: #e7b66d;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin: 0 0 10px;
      }
      h1 {
        font:
          48px/1.1 Georgia,
          serif;
        margin: 0 0 20px;
      }
      p {
        color: #b2bbc3;
        margin: 0 0 28px;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input,
      button {
        font: inherit;
        border-radius: 5px;
        width: 100%;
        padding: 15px 18px;
      }
      input {
        border: 1px solid #596874;
        background: #19232e;
        color: #f5f0e6;
      }
      button {
        border: 0;
        background: #e7b66d;
        color: #121b25;
        font-weight: 650;
        cursor: pointer;
        margin-top: 18px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #f5f0e6;
        outline-offset: 4px;
      }
      #message {
        min-height: 28px;
        margin: 14px 0 0;
        color: #f4a5a5;
        font-size: 14px;
      }
      small {
        display: block;
        color: #b2bbc3;
        font-size: 13px;
        margin-top: 28px;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #121b25;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 480px) {
        main {
          padding: 32px 24px;
        }
        .brand {
          margin-bottom: 42px;
        }
        .brand span {
          font-size: 38px;
        }
        h1 {
          font-size: 40px;
        }
      }
    </style>
    <script type="module" src="./gate.js?v=69ed6e30a12dd472ade7"></script>
  </head>
  <body>
    <main id="gate">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="30" fill="#121b25"/>
  <g stroke="#e7b66d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 48 26 19l25 15a43 43 0 0 1 26 0l25-15-6 29c8 10 11 21 8 34-4 20-20 29-40 31-20-2-36-11-40-31-3-13 0-24 8-34Z" fill="#172532"/>
    <path d="M30 72c0 17 7 27 18 33M98 72c0 17-7 27-18 33" fill="none"/>
    <path d="m52 91 4 4m4-2 4 4m4-4 4 4m4-6 4 4M47 112l-3 6m7-5v6m26-7 3 6m-7-5v6" fill="none"/>
  </g>
  <g fill="#f5f0e6" stroke="#e7b66d" stroke-width="3">
    <circle cx="45" cy="58" r="17"/><circle cx="83" cy="58" r="17"/>
  </g>
  <g fill="#121b25"><ellipse cx="46" cy="59" rx="7" ry="10"/><ellipse cx="82" cy="59" rx="7" ry="10"/></g>
  <g fill="#fff"><circle cx="48" cy="55" r="2.5"/><circle cx="84" cy="55" r="2.5"/></g>
  <path d="m57 75 7 11 7-11-7-5Z" fill="#e7b66d"/>
</svg>
<span>Seven Owls<b>.</b></span>
      </div>
      <p class="eyebrow" id="eyebrow">Private preview</p>
      <h1 id="heading">The password, please.</h1>
      <p id="intro">Enter the password to open the game.</p>
      <form id="unlock">
        <label for="password" id="label">Password</label
        ><input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          aria-describedby="message"
        /><button id="submit" type="submit">
          Open Seven Owls <span aria-hidden="true">↗</span>
        </button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <small id="privacy"
        >The game unlocks on this device. The password is not saved.</small
      >
    </main>
  </body>
</html>
